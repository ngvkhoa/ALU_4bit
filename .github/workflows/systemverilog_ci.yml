name: System Verilog Simulation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run Simulation
        run: |
          mkdir -p build
          iverilog -g2012 -o build/tb_ALU_4bit.out rtl/ALU_4bit.sv sim/tb_ALU_4bit.sv
          vvp build/tb_ALU_4bit.out
